<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chameleon Trader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column on phones; from 900px the chart sits left and the trade panel right. Black and gold, matched to the Chameleon app. */
:root{
  --bg:#0a0a09; --bg2:#100f0c; --surface:#15130f; --surface2:#1e1b15; --line:#2e2a20;
  --fg:#f2ecdd; --muted:#a29a86; --gold:#e8b923; --gold-hi:#ffe49a; --gold-lo:#8d6b0e;
  --up:#3fbf8a; --down:#e5604d; --info:#7fb4ff;
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font:600 22px/1 var(--font-display);letter-spacing:.04em;color:var(--gold-hi)}
.brand small{display:block;font:500 10px/1.2 var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font:500 12px var(--font-mono);color:var(--fg)}
.chip i{font-style:normal;color:var(--muted);font:500 10px var(--font-body);letter-spacing:.12em;text-transform:uppercase}
main{padding:20px 0 120px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,10,9,.96);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{background:none;border:0;border-radius:10px;padding:7px 2px 5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--font-body);cursor:pointer;min-height:48px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--gold-hi)}
.tab[aria-current="page"] svg{stroke:var(--gold)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.eyebrow{font:600 10.5px var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.h1{font:600 clamp(30px,6vw,46px)/1.05 var(--font-display);color:var(--fg);text-wrap:balance}
.h2{font:600 26px/1.15 var(--font-display);color:var(--gold-hi);text-wrap:balance}
.h3{font:700 15px var(--font-body);color:var(--fg)}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px}
.card.gold{border-color:rgba(232,185,35,.42);box-shadow:inset 0 1px 0 rgba(255,228,154,.14)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 48%,var(--gold-lo));color:#1a1405;border-color:#c79a1b;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 22px -10px rgba(232,185,35,.8)}
.btn.ghost{background:none}
.btn.sm{min-height:34px;padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(232,185,35,.1)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font:600 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill.gold{border-color:rgba(232,185,35,.5);color:var(--gold)}
.pill.up{border-color:rgba(63,191,138,.5);color:var(--up)}
.pill.down{border-color:rgba(229,96,77,.5);color:var(--down)}
.up{color:var(--up)} .down{color:var(--down)}
.disc{margin-top:26px;color:var(--muted);font-size:11.5px;text-align:center}
/* level rail */
.rail{list-style:none;margin:0;padding:0;display:grid;gap:0}
.lv{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;padding-bottom:18px;position:relative}
.lv::before{content:"";position:absolute;left:22px;top:46px;bottom:-2px;width:2px;background:var(--line)}
.lv:last-child::before{display:none}
.node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:600 20px var(--font-display);background:var(--surface);border:1.5px solid var(--line);color:var(--muted);z-index:1}
.lv.open .node{border-color:var(--gold);color:var(--gold-hi);box-shadow:0 0 0 4px rgba(232,185,35,.08)}
.lv.done .node{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#1a1405;border-color:var(--gold)}
.lv.locked{opacity:.6}
.lvbody{min-width:0;padding-top:2px}
.lvbody p{color:var(--muted);font-size:13px;margin-top:2px}
.dots{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
/* play */
.play{display:grid;gap:14px}
@media(min-width:900px){.play{grid-template-columns:minmax(0,1fr) 370px;align-items:start}}
.chartbox{border:1px solid var(--line);border-radius:14px;background:#0c0b09;overflow:hidden}
.tb{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);align-items:center}
.tb .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
canvas#cv{display:block;width:100%;height:360px;touch-action:none;cursor:grab}
@media(min-width:900px){canvas#cv{height:480px}}
.legend{padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}
.ctx{background:rgba(232,185,35,.07);border:1px solid rgba(232,185,35,.3);border-radius:10px;padding:10px 12px;font-size:13px}
.step{display:grid;gap:8px}
.stl{font:700 11px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dir{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;display:grid;gap:2px;min-height:64px}
.dir b{font-size:15px}.dir small{color:var(--muted);font-size:11.5px}
.dir.long.on{border-color:var(--up);background:rgba(63,191,138,.1)}
.dir.short.on{border-color:var(--down);background:rgba(229,96,77,.1)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--font-mono);text-align:right}
.big{font:600 34px/1 var(--font-display)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi))}
.part{display:grid;gap:4px;font-size:12.5px}
.part div:first-child{display:flex;justify-content:space-between}
.tag{border:1px solid rgba(229,96,77,.4);background:rgba(229,96,77,.07);border-radius:10px;padding:8px 10px;font-size:12.5px}
.tag b{display:block;color:var(--down);font-size:12px;margin-bottom:1px}
.tag.ok{border-color:rgba(63,191,138,.4);background:rgba(63,191,138,.07)}
.tag.ok b{color:var(--up)}
.expl{border-left:2px solid var(--gold);padding:2px 0 2px 12px}
/* forms */
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=search],textarea{background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;min-height:42px;width:100%}
textarea{min-height:120px;font-family:var(--font-mono);font-size:12px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gold)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.metric{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.metric i{font-style:normal;display:block;font:600 10px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.metric b{font:600 20px var(--font-mono);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 10.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
tr.sel td{background:rgba(232,185,35,.08)}
tbody tr{cursor:pointer}
.scroll{overflow-x:auto}
details{border-bottom:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;color:var(--gold)}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:6px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}
.badge.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(232,185,35,.08)}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border:1px solid rgba(232,185,35,.4);border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:grid;gap:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:6px;pointer-events:none}
#toast div{background:var(--surface2);border:1px solid var(--gold);color:var(--gold-hi);padding:8px 14px;border-radius:10px;font-size:13px}
canvas.mini{width:100%;height:110px;display:block;border:1px solid var(--line);border-radius:10px;background:#0c0b09}
.emb{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== iPhone shell + premium polish (overrides) ===== */
:root{--gold:#e9c46a;--gold-hi:#fff0c2;--gold-lo:#9a7420;--bg:#070706;--bg2:#0d0c09;--surface:#14120d;--surface2:#1c1913;--line:#2a2619;--glass:rgba(18,16,11,.66)}
html,body{height:100%}
body{padding:0!important;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(900px 620px at 50% -8%,rgba(233,196,106,.16),transparent 62%),radial-gradient(700px 500px at 50% 108%,rgba(233,196,106,.09),transparent 60%),#040403}
body::before{display:none}
.phone{position:relative;width:min(402px,100%);height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;isolation:isolate}
.island,.status{display:none}
@media(min-width:521px){
  .phone{height:min(874px,calc(100% - 24px));border-radius:58px;border:11px solid #14120d;
    box-shadow:0 0 0 2px #6b5522,0 0 0 4px #1d1a10,0 50px 100px -24px rgba(0,0,0,.95),0 0 140px -30px rgba(233,196,106,.38)}
  .island{display:block;position:absolute;z-index:80;top:11px;left:50%;width:116px;height:33px;margin-left:-58px;background:#000;border-radius:20px}
  .status{display:flex;position:absolute;z-index:70;top:0;left:0;right:0;height:52px;padding:16px 34px 0;justify-content:space-between;align-items:flex-start;font:700 15px var(--font-body);pointer-events:none}
  .status svg{height:12px;width:auto;fill:var(--fg);margin-left:6px}
  .top{padding-top:56px!important}
}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}
.wrap{max-width:none;margin:0}
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid rgba(255,240,194,.08);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr;gap:8px}
.brand b{font-size:24px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{margin:0;width:100%;display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px}
.chip{background:rgba(255,255,255,.04);border-color:rgba(255,240,194,.12);font-size:11.5px;padding:4px 9px}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 128px max(16px,env(safe-area-inset-left,0px))}
#view>*{animation:fadeup .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes halo{0%,100%{box-shadow:0 0 0 4px rgba(233,196,106,.1)}50%{box-shadow:0 0 0 9px rgba(233,196,106,.03),0 0 24px rgba(233,196,106,.35)}}
@keyframes cg{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;padding:5px 6px;border-radius:28px;border:1px solid rgba(255,240,194,.14);
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 18px 44px -12px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,240,194,.1)}
.tabs div{max-width:none}
.tab{border-radius:22px;font-size:10.5px;min-height:50px;transition:background .2s,color .2s}
.tab[aria-current="page"]{background:linear-gradient(180deg,rgba(233,196,106,.2),rgba(233,196,106,.07));box-shadow:inset 0 0 0 1px rgba(233,196,106,.3)}
.card{border-radius:22px;border-color:rgba(255,240,194,.09);background:linear-gradient(180deg,rgba(28,25,19,.9),rgba(13,12,9,.95));box-shadow:0 20px 40px -26px #000,inset 0 1px 0 rgba(255,240,194,.06)}
.card.gold{border-color:rgba(233,196,106,.38);background:radial-gradient(420px 220px at 85% -10%,rgba(233,196,106,.2),transparent 70%),linear-gradient(180deg,#1b1810,#0c0b08);box-shadow:0 24px 50px -28px rgba(233,196,106,.45),inset 0 1px 0 rgba(255,240,194,.18)}
.btn{border-radius:15px;transition:filter .15s,transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#fff0c2,#e9c46a 46%,#a67c1d);border-color:#d7ae4c;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 26px -10px rgba(233,196,106,.75)}
.btn.sm{border-radius:11px}
.pill{background:rgba(255,255,255,.03)}
.dir{border-radius:18px}
.chartbox{border-radius:22px;border-color:rgba(255,240,194,.12);background:#080807;box-shadow:0 24px 50px -28px #000}
canvas#cv{height:330px!important}
.play{grid-template-columns:1fr!important}
.ctx{border-radius:14px}
.metric{border-radius:16px;background:linear-gradient(180deg,var(--surface2),var(--bg2))}
.badge{border-radius:16px}
.lv.open .node{animation:halo 2.6s ease-in-out infinite}
.node{background:linear-gradient(180deg,#1d1a12,#0e0d09)}
.rank{display:grid;gap:6px;margin-top:14px}
#modal{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;align-items:end;justify-items:center;padding:0}
.mbox{max-width:none;width:100%;max-height:88%;border-radius:30px 30px 0 0;border:1px solid rgba(233,196,106,.3);border-bottom:0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#1a1710,#0b0a07);animation:sheet .34s cubic-bezier(.2,.8,.2,1) both;position:relative}
.mbox::before{content:"";position:absolute;top:9px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:rgba(255,240,194,.22)}
#modal.ob{background:#000;backdrop-filter:none;align-items:stretch}
#modal.ob .mbox{height:100%;max-height:none;border:0;border-radius:0;animation:none;background:radial-gradient(480px 380px at 50% 30%,rgba(233,196,106,.2),transparent 70%),#000;
  grid-template-rows:auto 1fr auto auto;text-align:center;padding:62px max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));gap:10px;overflow:hidden}
#modal.ob .mbox::before{display:none}
[hidden]{display:none!important}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .h1{font-size:25px!important;line-height:1.12}
.obtop{display:flex;justify-content:flex-end;min-height:34px}
.obart{display:grid;place-items:center;position:relative;min-height:0}
.obart .glow{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(233,196,106,.3),transparent 68%);animation:floaty 5s ease-in-out infinite}
.obart>*:not(.glow){position:relative;animation:floaty 5s ease-in-out infinite}
.obart svg.art{width:min(290px,80%);height:auto}
.obtxt{display:grid;gap:8px;justify-items:center}
.obtxt .h1{font-size:33px;max-width:11em}
.obtxt p{max-width:30ch}
.obfoot{display:grid;gap:14px}
.obfoot .btn{min-height:52px;font-size:16px}
.dotsnav{display:flex;gap:7px;justify-content:center}
.dotsnav i{width:7px;height:7px;border-radius:9px;background:rgba(255,240,194,.2);transition:width .3s,background .3s}
.dotsnav i.on{width:24px;background:var(--gold)}
#toast{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90}
#toast div{background:var(--glass);backdrop-filter:blur(16px);border-radius:16px;border-color:rgba(233,196,106,.4)}
@media(prefers-reduced-motion:reduce){.lv.open .node,.obart *{animation:none!important}}
.playing .chips,.playing .brand small{display:none}.playing .top{padding-bottom:8px}

/* ===== v3: night-penthouse look from the reference ad ===== */
:root{--bg:#04060c;--bg2:#070a13;--surface:#0c101b;--surface2:#131929;--line:#1e2639;--glass:rgba(12,16,28,.6);--gold:#f0c862;--gold-hi:#fff3c9;--gold-lo:#a97a1c;--up:#2fd197;--down:#ff5b6e}
body{background:#03050b}
.city{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#05070f 0%,#070d1d 55%,#0a1428 100%)}
.city i{position:absolute;display:block;border-radius:50%;filter:blur(7px)}
.city .col{border-radius:0;filter:blur(14px);bottom:0;width:70px;background:linear-gradient(180deg,rgba(120,170,255,0),rgba(120,170,255,.22) 40%,rgba(120,170,255,.06))}
.city .lamp{background:radial-gradient(circle,#ffe2ad 0,rgba(255,200,120,.45) 40%,transparent 70%);width:90px;height:90px;filter:blur(3px)}
.city::after{content:"";position:absolute;inset:0;background:radial-gradient(800px 560px at 50% 45%,rgba(240,200,98,.1),transparent 65%),linear-gradient(180deg,rgba(3,5,11,.35),rgba(3,5,11,.7))}
@media(max-width:520px){.city{display:none}}
.phone{background:var(--bg)}
@media(min-width:521px){.phone{border-color:#0a0d17;box-shadow:0 0 0 2px #6b5522,0 0 0 4px #141a2a,0 50px 110px -24px rgba(0,0,0,.95),0 0 150px -30px rgba(240,200,98,.4)}}
.card{background:linear-gradient(180deg,rgba(19,25,41,.92),rgba(7,10,19,.96));border-color:rgba(190,210,255,.08)}
.card.gold{background:radial-gradient(420px 220px at 85% -10%,rgba(240,200,98,.22),transparent 70%),linear-gradient(180deg,#171c2c,#080b14)}
.chartbox{background:#050810;border-color:rgba(190,210,255,.1)}
.mbox{background:linear-gradient(180deg,#141b2e,#070a12)}
.node{background:linear-gradient(180deg,#161d30,#080b14)}
.chip{background:rgba(190,210,255,.05);border-color:rgba(190,210,255,.12)}
.btn{background:linear-gradient(180deg,#171e30,#0f1422);border-color:rgba(190,210,255,.12)}
.btn.on{background:rgba(240,200,98,.12)}
.btn.gold{border-radius:999px;min-height:48px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;font-size:13.5px;position:relative;overflow:hidden;border:0;color:#1d1403;
  background:linear-gradient(180deg,#fff3c9 0,#f8d77f 36%,#e2ac3b 64%,#a97a1c 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -7px 14px rgba(120,80,0,.38),0 0 0 1px rgba(255,230,160,.4),0 16px 34px -10px rgba(240,200,98,.8),0 0 44px -8px rgba(240,200,98,.45)}
.btn.gold::after{content:"";position:absolute;left:9%;right:9%;top:3px;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.btn.gold::before{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.9);opacity:0;pointer-events:none}
.btn.gold:active::before{animation:rip .55s ease-out}
@keyframes rip{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(14)}}
.btn.gold[data-act=start]{min-height:56px;font-size:17px;letter-spacing:.2em}
.btn.gold:disabled{box-shadow:none;filter:saturate(.5)}
.btn.sm.gold{min-height:38px;font-size:12px}
.tab:nth-child(3){overflow:visible}
.tab:nth-child(3) svg{width:48px;height:48px;padding:12px;margin-top:-24px;border-radius:50%;stroke:#1d1403;stroke-width:2;background:radial-gradient(circle at 34% 28%,#fff3c9,#f0c862 52%,#a97a1c);box-shadow:0 10px 22px -4px rgba(240,200,98,.75),inset 0 1px 0 #fff,0 0 0 4px rgba(7,10,19,.85)}
.tab:nth-child(3)[aria-current="page"]{background:none;box-shadow:none;color:var(--gold-hi)}
.tab:nth-child(3){gap:0;justify-content:flex-end}
#toast div.sec{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;padding:12px 24px 12px 14px;border-radius:999px;min-width:270px;background:linear-gradient(180deg,rgba(26,33,53,.86),rgba(9,12,21,.92));border:1px solid rgba(240,200,98,.5);box-shadow:0 18px 40px -12px #000,0 0 34px -6px rgba(240,200,98,.45);animation:sheet .35s ease both}
.sec .ic{grid-row:span 2;width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font:800 16px var(--font-body)}
.sec b{color:var(--fg);font:700 15px var(--font-body)}.sec small{color:var(--muted);font-size:11.5px}

.hero{display:grid;grid-template-columns:1fr!important;justify-items:start;gap:4px}
.herologo{margin:2px 0 -8px -6px}
.hero .h1{font-size:27px!important}
.rscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 0;padding:2px max(16px,env(safe-area-inset-right,0px)) 10px 2px;scrollbar-width:none}
.rscroll::-webkit-scrollbar{display:none}
.rcard{flex:none;width:168px;scroll-snap-align:start;text-align:left;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid rgba(190,210,255,.12);background:linear-gradient(180deg,#0f1526,#070a12);box-shadow:0 18px 36px -22px #000;transition:transform .15s,border-color .2s}
.rcard:hover{border-color:rgba(240,200,98,.5)}.rcard:active{transform:scale(.97)}.rcard:disabled{opacity:.45}
.rcard canvas{display:block;width:100%;height:104px}
.rmeta{display:grid;gap:5px;padding:10px 12px 13px}.rmeta b{font:700 14px/1.25 var(--font-body);color:var(--fg)}.rmeta small{color:var(--muted);font-size:11.5px}
.scard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--font-body);color:#1d1403;box-shadow:0 0 0 2px rgba(4,6,12,.9),0 0 0 3px rgba(240,200,98,.4)}
.livetag{display:inline-block;background:#ff3b4f;color:#fff;font:800 10px var(--font-body);letter-spacing:.14em;padding:3px 8px;border-radius:99px;animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.55}}
#modal.room{background:#04060c;backdrop-filter:none;align-items:stretch}
#modal.room .mbox{height:100%;max-height:none;border:0;border-radius:0;animation:none;background:#04060c;padding:60px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;overflow:hidden}
#modal.room .mbox::before{display:none}
.rmtop{display:flex;justify-content:space-between;align-items:center}
.rmhost{display:flex;gap:10px;align-items:center}.rmhost b{display:block;font-size:13.5px}.rmhost small{color:var(--muted);font-size:11.5px}
.rmstage{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(190,210,255,.12);background:#050810;flex:none}
.rmstage canvas{display:block;width:100%;height:190px}
.rmcap{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(5,8,16,.8);backdrop-filter:blur(8px);border:1px solid rgba(240,200,98,.3);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.rmpoll{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;flex:none}
.rmchat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;scrollbar-width:none}
.msg{color:var(--fg)}.msg b{color:var(--muted);font-weight:700}.msg.host b{color:var(--gold)}.msg.host{background:rgba(240,200,98,.07);border-radius:10px;padding:5px 8px}.msg.you b{color:var(--info)}
.rmin{display:flex;gap:8px;flex:none}.rmin input{flex:1;border-radius:99px;padding:8px 14px}
.brow{display:grid;grid-template-columns:78px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.rmcap{position:static!important;border-radius:0!important;border:0!important;border-top:1px solid rgba(240,200,98,.25)!important;background:rgba(5,8,16,.9)!important;min-height:52px}

/* ===== mission cube ===== */

/* ===== v6: futuristic HUD redesign ===== */
:root{--font-display:'Chakra Petch','Inter',system-ui,sans-serif;--cy:#5ee7ff;--cy2:rgba(94,231,255,.35);--bg:#03050b;--bg2:#060a14;--surface:#0a1120;--surface2:#101a30;--line:#17304a;--up:#21f3a8;--down:#ff4569;--info:#5ee7ff;--glass:rgba(6,12,24,.7)}

  expl:"12 Sep 2023. There was none. Realized volatility sat near multi-year lows, and in quiet markets price tends to stay inside its recent range until a news event or a liquidity sweep forces a break. The edges of the multi-week range held every test. Inside the range, the middle gives no edge: both a Long and a Short are coin flips after fees."},
 R3:{title:"The halving",date:"11 May 2020",tag:"News",entry:8600,real:true,hist:[[150,0,0.45],[230,0.04,0.55],[100,-0.05,0.5]],fut:[[24,0,0.55,0.08,0]],key:-1,reason:"news",
  check:function(x){return Math.abs(x.end/x.e-1)<0.015&&x.maxH<x.e*1.05&&x.minL>x.e*0.93&&x.minL<x.e*0.985},
  context:"The Bitcoin halving, which cuts new coin issuance in half, happens later today. It has been scheduled for years.",hint:"Was this event a surprise to anybody?",
  expl:"11 May 2020. The halving was known, scheduled and widely discussed, so it was already in the price. It reduces new supply but creates no new demand on the day. Price chopped around while traders waited, and the supply effect plays out over months, if at all. No clean level broke: price rotated inside a range of a few percent. Without a break there is nothing to trade."},
 R4:{title:"Spot Bitcoin ETFs approved",date:"10 Jan 2024",tag:"News",entry:46500,real:true,hist:[[100,0,0.5],[220,0.05,0.55],[100,0,0.6,0.02,0],[60,0.04,0.5]],fut:[[2,1,0.35,0,0,4],[46,-0.17,0.5]],key:0,reason:"news",
  check:function(x){return x.maxH>x.e*1.012&&x.end<x.e*0.95&&x.end>x.e*0.90},
  context:"US spot Bitcoin ETF approval is expected today after months of anticipation. Price is up about 70% since October.",hint:"If everyone expects the news, who is left to buy once it arrives?",
  expl:"10 Jan 2024. The SEC approved the first US spot Bitcoin ETFs. The outcome had been priced in for three months, so the approval itself created few new buyers. Early longs sold into the headline, and the large Grayscale trust, newly converted to an ETF, saw heavy outflows. This is the classic sell-the-news pattern. The spike above the range top took out stops, then price fell back below it. A failed break with no follow-through is a warning that buyers are exhausted."},
 R5:{title:"The false ETF headline",date:"16 Oct 2023",tag:"News",entry:29900,real:true,hist:[[210,0,0.35,0.03,0],[250,0.01,0.3,0.03,0],[18,0,0.25],[2,3.4,0.35,0,0,6]],fut:[[24,-0.2,0.5]],key:-1,reason:"news",
  check:function(x){return x.end<x.e*0.97&&x.end>x.e*0.93&&x.maxH<x.e*1.012},
  context:"A headline says a major asset manager's spot Bitcoin ETF has been approved. Price just jumped about 7% in two hours on heavy volume.",hint:"Who is the original source of the headline?",
  expl:"16 Oct 2023. The headline was false. A crypto news outlet reported an approval based on unverified information and corrected it later. Traders who bought the spike were left holding the top as price retraced within hours. Before trading a headline, check whether the source is primary: the regulator or the issuer. The top of the pre-spike range was where price returned. A vertical move with no confirmation tends to give back the whole gap."},
 R6:{title:"Black Thursday",date:"12 Mar 2020",tag:"Liquidations",entry:7900,real:true,hist:[[200,0,0.5],[200,-0.045,0.55],[80,0,0.5]],fut:[[6,-0.3,0.6],[3,-6.5,1.5,0,0,8],[4,-5,1.5,0,0,7],[4,-4,1.5,0,0,6],[7,0.5,1.2]],key:1,reason:"trend",
  check:function(x){return x.end<x.e*0.7&&x.end>x.e*0.45&&x.minL<x.e*0.55},
  context:"Global stocks are falling hard as the coronavirus spreads and US markets halted trading earlier this week. Bitcoin has held near $8k so far. Futures leverage is high.",hint:"Which assets do people sell first when they need cash?",
  expl:"12 Mar 2020. A global rush for cash: stocks, gold and crypto sold together after the pandemic declaration and the announced US travel restrictions. On crypto exchanges, leveraged longs were liquidated in a cascade, and some exchanges slowed or went down under the load, which made forced selling worse. Bitcoin lost about half its value in roughly a day. Support near $7k failed instantly and there was no structure below until the $4k area. In a liquidation cascade, levels do not hold because the sellers are forced, not choosing."},
 R7:{title:"The May 2021 leverage flush",date:"19 May 2021",tag:"Liquidations",entry:42600,real:true,hist:[[100,-0.02,0.6],[200,-0.05,0.7],[100,0,0.65],[80,-0.01,0.65]],fut:[[2,-0.3,0.5],[5,-4.6,1,0,0,7],[3,4.5,1,0,0,5],[14,-0.1,0.7]],key:1,reason:"news",
  check:function(x){return x.end<x.e*0.92&&x.end>x.e*0.84&&x.minL<x.e*0.78&&x.minL>x.e*0.66},
  context:"Price has already fallen about a third from its April high, but futures open interest is still near record levels.",hint:"Price fell a lot already. Is the leverage gone too?",
  expl:"19 May 2021. Chinese industry bodies restated that financial institutions may not offer crypto services, adding to fear after Tesla stopped accepting Bitcoin. With heavily leveraged longs still open, the first break lower triggered forced liquidations that pushed price down further, and billions of dollars of positions were closed within hours. The rebound was just as sharp once the forced selling was over. The $40k round number broke first. The wick toward $30k is where forced selling ran out and buyers appeared. Stops sitting at round numbers were swept."},
 R8:{title:"The capitulation low",date:"13 Mar 2020",tag:"Liquidations",entry:4900,real:true,hist:[[240,0,0.5],[200,-0.03,0.6],[8,-4,1.2,0,0,6],[8,-1.5,1.2,0,0,4],[24,0.2,1.2,0,0,2]],fut:[[3,0.8,1.2,0,0,3],[4,2.5,1.2,0,0,4],[17,0.35,1]],key:1,reason:"reversal",
  check:function(x){return x.end>x.e*1.1&&x.end<x.e*1.35&&x.minL>x.e*0.93},
  context:"Bitcoin has just lost about 40% in two days. The latest candles show enormous volume and long lower wicks. Funding on perpetual futures has turned negative, so shorts now pay longs.",hint:"After forced selling, who is left to sell?",
  expl:"13 Mar 2020. Once the forced selling was done there were no leveraged longs left to liquidate. Central banks announced emergency liquidity measures, including repo operations, and risk assets steadied. Buyers stepped in at the extreme, and shorts who had chased the fall had to cover, which fed a sharp bounce. The low formed on the highest volume of the move with a long wick: a classic exhaustion signature. The first target after capitulation is a partial retrace of the fall."},
 R9:{title:"The FTX collapse",date:"9 Nov 2022",tag:"Macro",entry:18100,real:true,hist:[[240,0,0.35,0.02,0],[200,0,0.45],[40,-0.05,0.6]],fut:[[6,-0.2,0.5],[6,-1.3,0.8,0,0,4],[12,-0.2,0.7]],key:1,reason:"news",
  check:function(x){return x.end<x.e*0.93&&x.end>x.e*0.84},
  context:"One of the largest crypto exchanges is facing a run on withdrawals. Its own token has collapsed, and a rival exchange has just announced a deal to rescue it.",hint:"Is a non-binding rescue offer the same as a rescue?",
  expl:"9 Nov 2022. FTX, a top-three exchange, froze withdrawals after customers pulled funds en masse. A report on its sister trading firm, which held large amounts of FTX's own token, started the run. The rescue deal was dropped after the rival exchange reviewed the books, and a multi-billion-dollar hole was found. This was contagion: nobody knew who else was exposed. The $17k and $16k supports were taken out one by one while the solvency question was open. When the size of the damage is unknown, buyers wait."},
 R10:{title:"Bank failures and the USDC scare",date:"11 Mar 2023",tag:"Macro",entry:20400,real:true,hist:[[200,0,0.45,0.02,0],[240,-0.06,0.5],[40,0,0.55]],fut:[[20,0.03,0.6],[4,0.7,0.6,0,0,3],[24,0.35,0.6]],key:1,reason:"news",
  check:function(x){return x.end>x.e*1.1&&x.end<x.e*1.25&&x.minL>x.e*0.97},
  context:"Two US banks serving crypto firms have failed, and a major stablecoin has lost its dollar peg because part of its reserves is stuck in a failed bank. Equities are nervous.",hint:"What would the central bank do if the banking system was in trouble?",
  expl:"11 Mar 2023. US authorities guaranteed all deposits at the failed banks, which removed the immediate stablecoin risk, and traders began to expect the Fed to slow its rate hikes to protect the banking system. Bitcoin was also being seen as a bank-independent asset. Lower yields and a weaker dollar helped risk assets, and BTC rallied about 20% in two days. $20k held as support for days. The break above the prior range top near $22k started the run to $24k, with little resistance in between."},
 R11:{title:"The yen carry unwind",date:"5 Aug 2024",tag:"Macro",entry:58000,real:true,hist:[[200,0,0.5],[180,0.02,0.5],[100,-0.06,0.55]],fut:[[3,-0.2,0.6],[4,-3.8,1,0,0,6],[5,2.2,0.9,0,0,4],[12,0,0.7]],key:1,reason:"trend",
  check:function(x){return x.end<x.e*0.95&&x.end>x.e*0.9&&x.minL<x.e*0.88},
  context:"Bitcoin has fallen for three days after a weak US jobs report. Japanese markets open soon after the central bank's rate hike and the yen has been strengthening fast.",hint:"Daily chart trend versus the 5-minute chart: which one is telling the truth?",
  expl:"5 Aug 2024. The Bank of Japan raised rates and the yen jumped, forcing investors who had borrowed cheap yen to buy risk assets to close those trades. Japan's stock index had its worst day since 1987 and global risk assets sold off together. Crypto trades 24/7 and was already leveraged, so it took the first hit and then bounced fast once Asian markets stabilised. $50k was the psychological floor where forced selling dried up, and price reclaimed the mid-$50ks within hours. The wick shows how fast liquidity returned. Daily chart: a downtrend after failing near $70k. 1H chart: the bounce had run out of volume. Both pointed down, while the 5-minute chart looked oversold and tempted early buyers. Confluence between the higher timeframes was the signal."},
 R12:{title:"Election night breakout",date:"6 Nov 2024",tag:"Macro",entry:69500,real:true,hist:[[200,0,0.4,0.02,0],[200,0.03,0.45],[80,0,0.4,0.03,0]],fut:[[4,0.9,0.7,0,0,3],[6,0.55,0.6],[14,0.13,0.5]],key:0,reason:"breakout",
  check:function(x){return x.end>x.e*1.06&&x.end<x.e*1.15&&x.minL>x.e*0.985},
  context:"US election night is underway and counts are coming in. Bitcoin has been rising within a range just under its March all-time high (about $73.8k). Options and futures traders are positioned for a big move.",hint:"Do the daily, 4H and 1H charts agree on direction?",
  expl:"6 Nov 2024. As results came in, markets read the likely outcome as favourable to lighter crypto regulation, and BTC broke above its March all-time high. Short liquidations amplified the move once the level cleared. This describes the market's expectations about policy, not an endorsement of any party. The March all-time high near $73.8k was the trigger. Once it broke there was no resistance above, just like in Level 1. Daily chart: coiling just under the all-time high. 4H chart: higher lows held for weeks. 1H chart: a breakout candle with a volume spike confirmed it. When all three agree, that is confluence."},

 L3b:{title:'Sell the news',hist:[[300,0,.5],[180,.045,.5]],fut:[[16,.02,.4],[1,.8,.2,0,0,2.5],[55,-.08,.55]],key:1,reason:'news',

 L4a:{title:'Squeeze breakout',hist:[[380,0,.5,.02,0],[100,0,.3,.06,0]],fut:[[10,0,.3],[2,2.2,.3,0,0,4],[84,.04,.5]],key:1,zr:[380,480],zone:'range',reason:'breakout',

 L4b:{title:'Selling exhaustion',hist:[[300,0,.5],[156,-.07,.6],[24,0,.3,0,0,.6]],fut:[[96,.055,.55]],reason:'reversal',

 L5b:{title:'Surprise sell-off',hist:[[100,0,.5],[380,.03,.45]],fut:[[20,.02,.45],[6,-.9,.45,0,0,4],[70,-.03,.6]],key:1,reason:'trend',

function lessonNo(id){return SPECS[id]&&SPECS[id].lesson}

function lessonCard(){

}
function lessonRows(lv){
  var done=lv.sc.filter(function(id){return S.best[id]!=null}),avg=done.length?Math.round(done.reduce(function(a,id){return a+S.best[id]},0)/done.length):0,nx=nextOf(lv),nk=nx?lessonNo(nx):0,un=lvUnlocked(lv.n);
  var h='<div class="lprog"><div class="row" style="justify-content:space-between"><b>'+done.length+' of '+lv.sc.length+' lessons</b><span class="muted small">'+(done.length?'average '+avg:'not started')+'</span></div><div class="bar"><i style="width:'+(done.length/lv.sc.length*100)+'%"></i></div><p class="muted small">Finish '+Math.ceil(lv.sc.length*.8)+' lessons with an average of 60 to unlock the next level.</p></div>';
  lv.parts.forEach(function(p){
    var open=nk>=p[1]&&nk<=p[2],cnt=0,rows='';
    for(var k=p[1];k<=p[2];k++){var id=lv.sc[k-1],b=S.best[id];if(b!=null)cnt++;
      rows+='<button class="lrow '+(b!=null?'done':'')+(id===nx?' next':'')+'" data-act="play" data-n="'+lv.n+'" data-id="'+id+'"'+(un?'':' disabled')+'><i>'+k+'</i><span>'+esc(SPECS[id].title)+'</span><em>'+(b!=null?b:(id===nx?'Next':''))+'</em></button>';}
    h+='<details class="lpart"'+(open?' open':'')+'><summary><b>'+esc(p[0])+'</b><span class="muted small">'+cnt+' of '+(p[2]-p[1]+1)+'</span></summary><div class="lrows">'+rows+'</div></details>';
  });
  return h;
}

var S=load();

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function touchDay(){var t=dayKey();if(S.daily.day!==t){var y=new Date();y.setDate(y.getDate()-1);S.streak=S.lastDay===dayKey(y)?S.streak+1:1;S.lastDay=t;S.daily={day:t,n:0}}}
function rank(){var r=RANKS[0],nx=null;for(var i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null}}return{name:r[1],from:r[0],next:nx}}
function avgBest(lv){return lv.sc.length?lv.sc.reduce(function(a,id){return a+(S.best[id]||0)},0)/lv.sc.length:0}
function lvDone(lv){if(lv.parts&&lv.sc.length){var dn=lv.sc.filter(function(id){return S.best[id]!=null});return dn.length>=Math.ceil(lv.sc.length*.8)&&dn.reduce(function(a,id){return a+S.best[id]},0)/dn.length>=60}return lv.sc.length>0&&lv.sc.every(function(id){return S.best[id]!=null})&&avgBest(lv)>=60}
function lvUnlocked(n){if(S.demo||n===1)return true;if(LEVELS[n-1].real)return lvDone(LEVELS[3]);var p=LEVELS[n-2];return p.lab?false:lvDone(p)}
function isPro(){return S.demo||S.pro}

function analyze(r){

/* pointer interactions */
function yToPrice(y){return L.pmax-(y-L.mainTop)/L.mainH*(L.pmax-L.pmin)}
function pDown(e){
  if(!L||!P)return;var cv=e.currentTarget,r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;cv.setPointerCapture(e.pointerId);
  if(P.phase==='setup'&&P.side){
    var hit=null;if(P.sl!=null&&Math.abs(y-L.yP(P.sl))<16)hit='sl';
    if(P.tp!=null&&Math.abs(y-L.yP(P.tp))<16&&(hit==null||Math.abs(y-L.yP(P.tp))<Math.abs(y-L.yP(P.sl))))hit='tp';
    if(hit){P.drag={k:hit};P.lock={pmin:L.pmin,pmax:L.pmax};cv.style.cursor='ns-resize';return}
  }
  if(P.tool&&x<L.plotX+L.plotW){
    var pr=yToPrice(y);
    if(P.tool==='h'){P.user.push({type:'h',p:pr});P.tool=null;refreshTools();redraw();return}
    var b=Math.floor((L.first+(x-L.plotX)/L.cw)*L.f);
    if(!P.pend){P.pend={b:b,p:pr}}else{P.user.push({type:'t',b1:P.pend.b,p1:P.pend.p,b2:b,p2:pr});P.pend=null;P.tool=null;refreshTools()}
    redraw();return;
  }
  P.drag={k:'pan',x:x,s:P.shift};cv.style.cursor='grabbing';
}
function pMove(e){
  if(!P||!P.drag||!L)return;var r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,d=P.drag;
  if(d.k==='pan'){P.shift=clamp(d.s+(x-d.x)/L.cw,-Math.round(P.span*.3),Math.max(0,L.n-12));redraw();return}
  var e0=P.entry,pr=yToPrice(y),s=sgn(),minD=e0*0.001;
  if(d.k==='sl'){P.sl=s>0?Math.min(pr,e0-minD):Math.max(pr,e0+minD)}
  if(d.k==='tp'){P.tp=s>0?Math.max(pr,e0+minD):Math.min(pr,e0-minD)}

}
function pUp(e){if(!P)return;if(P.drag){P.drag=null;P.lock=null;e.currentTarget.style.cursor='grab';redraw()}}

function readRule(){var s=$('#stStop').value;return{cond:$('#stCond').value,side:$('#stSide').value,stop:{t:s[0]==='p'?'pct':'atr',v:parseFloat(s.slice(1))},rr:parseFloat($('#stRR').value),risk:parseFloat($('#stRisk').value)}}
function runStrategy(){
  var rule=readRule(),sel=$('#stMkt').value,res={};
  MKT.forEach(function(m){res[m[0]]=backtest(market(m[0],m[2]),rule)});
  S.lastRule={cond:$('#stCond').value,side:$('#stSide').value,stop:$('#stStop').value,rr:$('#stRR').value,risk:$('#stRisk').value};S.lastMkt=sel;
  var r=res[sel],pf=r.pf===Infinity?'∞':r.pf.toFixed(2);
  var verdict;

  else if(r.avgR>0.05)verdict='Positive expectancy here ('+r.avgR.toFixed(2)+'R per trade). With a '+r.winRate.toFixed(0)+'% win rate and a 1:'+rule.rr+' target, the average win is bigger than the average loss. Check the other markets before trusting it.';
  else verdict='Negative or flat expectancy ('+r.avgR.toFixed(2)+'R per trade). A '+r.winRate.toFixed(0)+'% win rate at 1:'+rule.rr+' does not cover the losses. Try a different target or a different entry.';

  $('#stOut').innerHTML='<div class="row" style="justify-content:space-between"><h2 class="h3">Results · '+MKT.filter(function(m){return m[0]===sel})[0][1]+'</h2><span class="pill gold">4,000 candles</span></div>'
   +'<div class="metrics"><div class="metric"><i>Trades</i><b>'+r.trades+'</b></div><div class="metric"><i>Win rate</i><b>'+r.winRate.toFixed(0)+'%</b></div><div class="metric"><i>Avg R</i><b class="'+(r.avgR>=0?'up':'down')+'">'+r.avgR.toFixed(2)+'</b></div><div class="metric"><i>Profit factor</i><b>'+pf+'</b></div><div class="metric"><i>Max drawdown</i><b class="down">−'+r.maxDD.toFixed(0)+'%</b></div><div class="metric"><i>Net return</i><b class="'+(r.net>=0?'up':'down')+'">'+pct(r.net,0)+'</b></div></div>'

   +'<p>'+esc(verdict)+'</p>'
   +'<div><div class="stl" style="margin-bottom:6px">Does it work in every market? Profitable in '+pos+' of 4</div><div class="scroll"><table><thead><tr><th>Market</th><th>Trades</th><th>Win</th><th>Net</th><th>Max DD</th></tr></thead><tbody>'
   +MKT.map(function(m){var x=res[m[0]];return'<tr tabindex="0" data-act="mk" data-k="'+m[0]+'" class="'+(m[0]===sel?'sel':'')+'"><td>'+m[1]+'</td><td class="mono">'+x.trades+'</td><td class="mono">'+x.winRate.toFixed(0)+'%</td><td class="mono '+(x.net>=0?'up':'down')+'">'+pct(x.net,0)+'</td><td class="mono">−'+x.maxDD.toFixed(0)+'%</td></tr>'}).join('')+'</tbody></table></div></div>';
  drawEquity($('#eq'),r.eq);award('lab');save();renderChrome();

function faceMeta(i){

  return[
   ['Learning path','Level '+lv.n+' of 8 · '+lv.name],
   ['Real replays',done+' of 12 moments played'],
   ['Today\'s missions',Math.min(td,3)+' of 3 scenarios played'],
   ['Live lessons',live?'Live now: '+live.title:'Next lesson coming up'],
   ['Strategy Lab',S.strategies.length?S.strategies.length+' saved, test them':'Build your first rule'],
   ['Rank path',rk.name+' · '+S.xp+' XP'+(rk.next?' · '+(rk.next[0]-S.xp)+' to '+rk.next[1]:'')]
  ][i];
}
function cubeSection(){
  var faces=[0,1,2,3,4,5].map(function(i){return'<div class="cf" data-i="'+i+'" style="transform:'+FACE_T[i]+' translateZ(calc(var(--s) / 2))">'+faceSvg(i)+'</div>'}).join('');
  var plates=[0,1,2,3,4,5].map(function(i){return'<div class="ip" style="transform:'+FACE_T[i]+' translateZ(calc(var(--s) / 2 - 17px))"></div>'}).join('');
  return'<section class="card cubecard"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Mission cube</div><h2 class="h2" style="font-size:22px">Where you are right now</h2></div><span class="pill gold">Spin me</span></div>'
   +'<div class="cubewrap" id="cubewrap" tabindex="0" role="group" aria-label="Mission cube. Drag to spin, or use the left and right arrow keys."><div class="cubeglow"></div><div class="cubefloor"><i></i><i></i></div><div class="cubetilt"><div class="cube" id="cube">'+plates+faces+'</div></div><div class="cubeshadow"></div></div>'
   +'<div class="cubelbl"><div style="min-width:0"><b id="cubet"></b><p class="muted small" id="cubes"></p></div><button class="btn gold sm" data-act="cubeopen">Open</button></div>'
   +'<div class="dotsnav" id="cubedots">'+[0,1,2,3,4,5].map(function(i){return'<button data-act="cubeface" data-i="'+i+'" aria-label="Face '+(i+1)+'"></button>'}).join('')+'</div></section>';

function cubeApply(force){
  var c=$('#cube');if(!c)return;var t='rotateX('+CUBE.rx.toFixed(2)+'deg) rotateY('+CUBE.ry.toFixed(2)+'deg)';
  if(force||t!==CUBE.last){c.style.transform=t;CUBE.last=t;c.style.setProperty('--sx',(((CUBE.ry*.5+CUBE.rx*.3)%100)+100)%100+'%')}
}
function cubeFront(i){
  CUBE.front=i;var m=faceMeta(i),a=$('#cubet'),b=$('#cubes');if(a)a.textContent=m[0];if(b)b.textContent=m[1];
  $$('#cubedots button').forEach(function(d,k){d.className=k===i?'on':''});
}
function cubeSnap(i){
  var c=$('#cube');if(!c)return;CUBE.auto=false;var tg=snapTarget(i);CUBE.rx=tg[0];CUBE.ry=tg[1];
  c.classList.add('snap');cubeApply(true);cubeFront(i);setTimeout(function(){var e=$('#cube');if(e)e.classList.remove('snap')},700);
}
function cubeOpen(i){
  if(i===0){var lv=curLevel();if(lv.lab)return go('strategy');ACT.play({dataset:{n:String(lv.n),id:nextOf(lv)||lv.sc[0]}})}
  else if(i===1){var id=LEVELS[8].sc.filter(function(x){return S.best[x]==null})[0]||LEVELS[8].sc[0];ACT.play({dataset:{n:'9',id:id}})}
  else if(i===2){var l2=curLevel();if(l2.lab)return go('strategy');ACT.play({dataset:{n:String(l2.n),id:nextOf(l2)||l2.sc[0]}})}
  else if(i===3)go('library');else if(i===4)go('strategy');else go('profile');
}
function cubeInit(){
  var w=$('#cubewrap');if(!w)return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  CUBE.auto=!reduce;cubeApply(true);cubeFront(frontFace(CUBE.rx,CUBE.ry));
  w.onpointerdown=function(e){CUBE.drag={x:e.clientX,y:e.clientY,moved:0,t:e.target};CUBE.auto=false;var c=$('#cube');if(c)c.classList.remove('snap');try{w.setPointerCapture(e.pointerId)}catch(x){}w.classList.add('grab')};
  w.onpointermove=function(e){var d=CUBE.drag;if(!d)return;var dx=e.clientX-d.x,dy=e.clientY-d.y;d.x=e.clientX;d.y=e.clientY;d.moved+=Math.abs(dx)+Math.abs(dy);CUBE.ry+=dx*.55;CUBE.rx-=dy*.55;CUBE.rx=Math.max(-100,Math.min(100,CUBE.rx));cubeApply();var f=frontFace(CUBE.rx,CUBE.ry);if(f!==CUBE.front)cubeFront(f)};
  var up=function(){var d=CUBE.drag;CUBE.drag=null;w.classList.remove('grab');if(!d)return;
    if(d.moved<8){var cf=d.t&&d.t.closest?d.t.closest('.cf'):null,i=cf?+cf.dataset.i:frontFace(CUBE.rx,CUBE.ry);if(i===CUBE.front&&Math.abs(CUBE.rx%90)<12&&Math.abs(CUBE.ry%90)<12)cubeOpen(i);else cubeSnap(i)}
    else cubeSnap(frontFace(CUBE.rx,CUBE.ry))};
  w.onpointerup=up;w.onpointercancel=up;
  w.onkeydown=function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();cubeSnap((CUBE.front+(e.key==='ArrowRight'?1:5))%6)}if(e.key==='Enter')cubeOpen(CUBE.front)};
  if(!CUBE.raf)CUBE.raf=requestAnimationFrame(function cubeLoop(){
    CUBE.raf=0;if(!$('#cube'))return;
    if(CUBE.auto&&!CUBE.drag){CUBE.ry+=.28;CUBE.tick++;cubeApply();if(CUBE.tick%12===0){var f=frontFace(CUBE.rx,CUBE.ry);if(f!==CUBE.front)cubeFront(f)}}
    CUBE.raf=requestAnimationFrame(cubeLoop);
  });
}

function levelArt(lv){
  var m=MINI[lv.mini]||MINI.trend,W=300,Hh=58,pts=m.pts,n=24,cs=[],i,prev=pts[0];
  var at=function(t){var f=t*(pts.length-1),a=Math.floor(f),b=Math.min(pts.length-1,a+1);return pts[a]+(pts[b]-pts[a])*(f-a)};
  for(i=0;i<n;i++){var c=at((i+1)/n),o=prev,j=((i*37)%7-3)/90;c+=j;cs.push({o:o,c:c,h:Math.min(o,c)-.04-((i*13)%5)/90,l:Math.max(o,c)+.04+((i*11)%5)/90});prev=c}
  var Y=function(v){return 6+v*(Hh-12)},X=function(k){return 8+k*(W-16)/(n-1)},o='<svg viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none" aria-hidden="true">';
  for(i=1;i<4;i++)o+='<line x1="0" x2="'+W+'" y1="'+(Hh*i/4)+'" y2="'+(Hh*i/4)+'" stroke="rgba(190,210,255,.07)"/>';
  (m.lines||[]).forEach(function(l,k){var col=m.labels?(m.labels[k]==='stop'?'#ff5b6e':m.labels[k]==='target'?'#2fd197':'#fff3c9'):'#f0c862';
    o+='<line x1="0" x2="'+(W-46)+'" y1="'+Y(l)+'" y2="'+Y(l)+'" stroke="'+col+'" stroke-dasharray="5 4" opacity=".85"/>'+(m.labels?'<text x="'+(W-4)+'" y="'+(Y(l)+3)+'" text-anchor="end" font-size="8.5" font-weight="700" fill="'+col+'" font-family="Manrope,sans-serif">'+m.labels[k].toUpperCase()+'</text>':'')});
  cs.forEach(function(c,k){var up=c.c<=c.o,col=up?'#2fd197':'#ff5b6e',x=X(k);
    o+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(c.h)+'" y2="'+Y(c.l)+'" stroke="'+col+'" stroke-width="1.1"/><rect x="'+(x-3.2)+'" y="'+Y(Math.min(c.o,c.c))+'" width="6.4" height="'+Math.max(1.6,Math.abs(Y(c.o)-Y(c.c)))+'" fill="'+col+'"/>'});
  return o+'</svg>';
}
